# Append this isolated server block to the existing sites-enabled/default.
# Never replace or edit the shared server's existing configuration.
server {
    listen 443 ssl;
    server_name api.nostr.directory;
    ssl_certificate /etc/letsencrypt/live/api.nostr.directory/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nostr.directory/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    client_max_body_size 16k;
    client_body_timeout 5s;
    access_log off;
    error_log /var/log/nginx/nostr-directory-error.log crit;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag noindex always;

    error_page 502 503 504 = @directory_unavailable;
    location @directory_unavailable {
        default_type application/json;
        return 503 '{"error":"Directory temporarily unavailable","stale":true}';
    }
    location / {
        proxy_pass http://127.0.0.1:18140;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 8s;
    }
}
